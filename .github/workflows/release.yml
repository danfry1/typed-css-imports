name: Release

# Pushing a signed v* tag on main stages that version on npm. npm makes it installable only after a maintainer
# approves it with 2FA (`npm stage approve <id>` or on npmjs.com), so this workflow alone can't publish anything.
# The npm token comes from trusted publishing (OIDC); no npm secret is stored in the repository.
on:
  push:
    tags:
      - "v*"

permissions: read-all

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Forks never release.
    if: github.repository == 'danfry1/typed-css-imports'
    permissions:
      contents: read
      id-token: write
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved); the comment records the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, including origin/main, which the tag-on-main check compares against. (With
          # persist-credentials: false a later `git fetch` can't authenticate to a private repository.)
          fetch-depth: 0

      - name: Tag is on main
        # A tag on a branch commit, or on a commit from before a fix landed, would pass every later check.
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The tagged commit $(git rev-parse HEAD) is not on main."
            exit 1
          fi

      - name: Commit and tag are signed
        # Annotated, signed tags only: a lightweight tag has no tag object, so the second lookup fails.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.commit.verification.verified')" = true
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" --jq '.object.sha')
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.verification.verified')" = true

      - name: Tag matches package.json and CHANGELOG.md
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          test "v$version" = "$TAG_NAME"
          grep -qx "## $version" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $version' section."; exit 1; }

      # Installs the pnpm version (and checks the hash) from package.json "packageManager".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # npm stage needs npm >= 11.15. Use the lockfile-pinned npm (a devDependency) instead of the runner's.
      - name: Use the repository's npm
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - run: pnpm audit --audit-level moderate
      - run: pnpm test
      - run: pnpm test:package

      - name: Generate SBOM (CycloneDX)
        run: pnpm sbom --sbom-format cyclonedx --prod > typed-css-imports-sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: typed-css-imports-sbom.cdx.json

      - name: Stage on npm
        # Provenance is generated automatically for trusted publishing from a public repository.
        # A prerelease version goes to the "beta" dist-tag, so it never becomes what a plain install resolves to.
        run: |
          version=$(node -p 'require("./package.json").version')
          case "$version" in *-*) tag=beta ;; *) tag=latest ;; esac
          echo "Staging $version under dist-tag $tag"
          npm stage publish --tag "$tag"
          echo "::notice::$version is staged on npm. Approve it with 2FA (npm stage approve <id>, or on npmjs.com) to make it installable."

  github-release:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
      - name: Create the GitHub release from the CHANGELOG.md section
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          awk -v h="## $version" '$0 == h { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          prerelease=$([ "${version#*-}" != "$version" ] && echo --prerelease || true)
          gh release create "$TAG_NAME" --title "$TAG_NAME" --notes-file notes.md $prerelease typed-css-imports-sbom.cdx.json
