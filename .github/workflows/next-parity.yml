name: Next.js parity

# Builds examples/next-parity with webpack and Turbopack and checks that the names Next.js exports for each CSS and
# Sass module match the types. Two production builds are too slow for every push, so this runs weekly, on demand,
# and on pull requests that change the Next.js or postcss-modules version (e.g. Dependabot updates), which is when
# parity can break. A failed weekly or manual run opens an issue (or comments on the open one).
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - pnpm-lock.yaml
      - package.json
      - examples/next-parity/**

permissions:
  contents: read

concurrency:
  group: next-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved); the comment records the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Pull requests need the base commit to see which versions changed.
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
      - name: Check whether this pull request changes Next.js, postcss-modules or the check itself
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" "$HEAD" -- examples/next-parity | grep -q .; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --unified=0 "$BASE" "$HEAD" -- pnpm-lock.yaml package.json examples/next-parity/package.json \
            | grep -E '^[+-][^+-]' | grep -qE '(^[+-]|[^a-z@/-])(next|postcss-modules)(@|": )'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Next.js or postcss-modules version change; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      # Installs the pnpm version (and checks the hash) from package.json "packageManager".
      - if: steps.gate.outputs.run == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.gate.outputs.run == 'true'
        run: pnpm --filter example-next-parity run parity
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  report:
    needs: parity
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only this job can write, and only to issues.
    permissions:
      issues: write
    steps:
      - name: Open an issue, or comment on the open one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          title="Next.js parity check failed"
          body="The Next.js parity check failed ($EVENT run): $RUN_URL"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
