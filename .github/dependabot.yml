# Update PRs wait out the same one-week window as pnpm's minimumReleaseAge (pnpm-workspace.yaml).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Keep @types/node on a major that type-checks src/ (26's stream types reject server.js's Buffer handling).
      # A major bump is a deliberate change.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # npm is the release tool (npm stage publish), which CI doesn't exercise, and a new major can raise the Node
      # range that engineStrict enforces on every contributor's install.
      - dependency-name: "npm"
        update-types: ["version-update:semver-major"]
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
