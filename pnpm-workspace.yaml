# Supply-chain settings. Every dependency, direct or transitive, must have been published for at least
# a week before it can be installed, so a compromised release has time to be caught and pulled.
minimumReleaseAge: 10080
# Exact versions only; upgrades are deliberate edits.
savePrefix: ''
# Transitive dependencies may only come from the registry, never git URLs or tarballs.
blockExoticSubdeps: true
# Fail if a package's trust evidence (provenance, trusted publisher) drops from an earlier version.
trustPolicy: no-downgrade
# No install scripts run unless listed here, and an unlisted package that wants one fails the install.
strictDepBuilds: true
# Build decisions per package. sass's optional file watcher is only used by `sass --watch`, so its build is denied.
allowBuilds:
  "@parcel/watcher": false

# The package itself plus example apps that use it via workspace:*.
packages:
  - "."
  - "examples/*"
# Refuse to run package scripts when node_modules does not match the lockfile.
verifyDepsBeforeRun: error
# Fail the install on a Node.js version outside `engines`.
engineStrict: true
